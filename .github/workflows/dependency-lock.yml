name: Refresh dependency lock

on:
  push:
    branches:
      - "feature/batch5-profiles-directories"
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Apply compatible audit fixes
        run: npm audit fix --package-lock-only || true

      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "deps: refresh audited dependency lock [skip ci]"
          git push

name: CI

on:
  push:
    branches:
      - main
      - "stabilization/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "stabilization/**"

permissions:
  contents: read

jobs:
  validate:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase rules test tooling
        run: npm install --no-save --no-package-lock firebase-tools@14.22.0 @firebase/rules-unit-testing@5.0.0

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check administrative script syntax
        run: |
          node --check scripts/migrate-batch6-marketplace-data.mjs
          node --check scripts/manage-privileged-access.mjs
          node --check scripts/manage-professional-authority.mjs

      - name: Firebase authorization rules tests
        run: npx firebase emulators:exec --project demo-pharmanetwork --only firestore,storage "node --test --test-concurrency=1 tests/rules/*.test.mjs"

name: CI

on:
  push:
    branches:
      - main
      - "stabilization/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "stabilization/**"

permissions:
  contents: read

jobs:
  validate:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build
